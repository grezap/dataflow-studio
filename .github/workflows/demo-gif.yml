name: demo-gif

# Auto-recording (§6 #17): render the portfolio walkthrough (scripts/demo.tape) to a GIF with VHS,
# reproducibly in CI. Runs on demand + when the tape changes; publishes the GIF as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/demo.tape", ".github/workflows/demo-gif.yml"]

permissions:
  contents: read
  packages: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore + build (so the tape's dotnet steps are fast)
        run: |
          dotnet restore DataFlowStudio.slnx
          dotnet build DataFlowStudio.slnx -c Release --no-restore

      - name: Build the Api image (the tape's `docker run` uses it)
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=github_packages_token,env=GITHUB_PACKAGES_TOKEN \
            --build-arg PROJECT=src/DataFlowStudio.Api/DataFlowStudio.Api.csproj \
            --build-arg ENTRY_DLL=DataFlowStudio.Api.dll \
            -f deploy/Dockerfile -t dfs-api:latest .

      # Install VHS + its deps manually — charmbracelet/vhs-action@v2's own ffmpeg install is broken on
      # the current runner ("Failed to install ffmpeg"), so we provision the tools ourselves.
      - name: Install VHS + ttyd + ffmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          ttyd_url=$(curl -fsSL https://api.github.com/repos/tsl0922/ttyd/releases/latest \
            | grep -o 'https://[^"]*ttyd\.x86_64' | head -1)
          sudo curl -fsSL "$ttyd_url" -o /usr/local/bin/ttyd && sudo chmod +x /usr/local/bin/ttyd
          vhs_asset=$(curl -fsSL https://api.github.com/repos/charmbracelet/vhs/releases/latest \
            | grep -o 'https://[^"]*Linux_x86_64\.tar\.gz' | head -1)
          curl -fsSL "$vhs_asset" -o /tmp/vhs.tgz
          tar -xzf /tmp/vhs.tgz -C /tmp
          sudo find /tmp -maxdepth 2 -name vhs -type f -exec mv {} /usr/local/bin/vhs \;
          sudo chmod +x /usr/local/bin/vhs
          vhs --version && ttyd --version && ffmpeg -version | head -1

      - name: Render the tape to a GIF
        run: vhs scripts/demo.tape

      - name: Upload the GIF
        uses: actions/upload-artifact@v7
        with:
          name: dataflow-studio-demo-gif
          path: docs/media/dataflow-studio-demo.gif
          if-no-files-found: warn
