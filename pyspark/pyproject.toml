[project]
name = "dfs-conform"
version = "0.1.0"
description = "DataFlow Studio silver-layer conformance — PySpark job that reads the StarRocks Kimball star and builds a conformed customer-360 mart."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grigoris Zapantis" }]
dependencies = [
    "pyspark>=3.5,<4",
    "pydantic>=2.7,<3",
]

[project.scripts]
dfs-conform = "dfs_conform.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfs_conform"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# `F` is the universal alias for pyspark.sql.functions; N812 (non-lowercase import) is a false positive here.
ignore = ["N812"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# PySpark ships incomplete type stubs; check our code strictly and treat pyspark as untyped at the boundary.
[[tool.mypy.overrides]]
module = ["pyspark.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
