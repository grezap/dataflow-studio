# EXAMPLE ONLY — do not commit real credentials. In the lab these are projected from Vault (e.g. the
# Vault Secrets Operator or a CSI provider); this file documents the shape kubectl would expect.
# Create the real one out-of-band:  kubectl -n dataflow-studio create secret generic dfs-credentials ...
apiVersion: v1
kind: Secret
metadata:
  name: dfs-credentials
  namespace: dataflow-studio
type: Opaque
stringData:
  DFS_SQL_CONN: "Server=192.168.70.17;Database=OltpDb;User ID=sa;Password=CHANGEME;Encrypt=True;TrustServerCertificate=True"
  DFS_STARROCKS_CONNECTION: "Server=192.168.70.31;Port=9030;User ID=root;Password=CHANGEME;SslMode=None;AllowPublicKeyRetrieval=true"
  DFS_CLICKHOUSE_CONNECTION: "Host=192.168.70.44;Port=8443;Protocol=https;Database=analytics;Username=default;Password=CHANGEME"
  # Kafka mTLS material, projected to /secrets/*.pem by the volume in the Deployment/Job.
  kafka-ca.pem: "-----BEGIN CERTIFICATE-----\nCHANGEME\n-----END CERTIFICATE-----"
  kafka-cert.pem: "-----BEGIN CERTIFICATE-----\nCHANGEME\n-----END CERTIFICATE-----"
  kafka-key.pem: "-----BEGIN PRIVATE KEY-----\nCHANGEME\n-----END PRIVATE KEY-----"
